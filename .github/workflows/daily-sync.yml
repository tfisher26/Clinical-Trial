name: Daily trial sync and generation

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      queue_batch_limit:
        description: 'Max trials each queue job may process this run'
        required: false
        default: '5000'
      full_reconcile:
        description: 'Also run the weekly full check (normally Sundays only)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write   # needed to commit the pending-*/queue.md files back to the repo

# Never let a slow run overlap the next day's run — they'd fight over
# the same queue files and the same pending flags.
concurrency:
  group: daily-sync
  cancel-in-progress: false

env:
  QUEUE_BATCH_LIMIT: ${{ github.event.inputs.queue_batch_limit || '5000' }}

jobs:
  # ------------------------------------------------------------------
  # 1. Bring trials_factual up to date with ClinicalTrials.gov. Daily it
  #    fetches only trials updated since the last successful run; on
  #    Sundays (or when full_reconcile is ticked) it also runs a light
  #    id-only check of the whole recruiting list. See sync-trials.js.
  # ------------------------------------------------------------------
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SYNC_FULL: ${{ github.event.inputs.full_reconcile || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: pipeline
        run: npm install
      - name: Sync trials (no AI)
        working-directory: pipeline
        run: node jobs/sync-trials.js

      # The website searches a small copy of the trial data; bring it up to
      # date with what the sync just wrote. Runs even if the sync failed
      # partway, so whatever did get written is searchable.
      - name: Refresh website search index
        if: always()
        working-directory: pipeline
        run: node jobs/refresh-search.js

  # ------------------------------------------------------------------
  # 2. Classification and taxonomy mapping. map-conditions is now a
  #    single RPC (migrations/005) rather than ~60k round-trips, so this
  #    job should finish in a couple of minutes.
  # ------------------------------------------------------------------
  classify:
    needs: sync
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: pipeline
        run: npm install

      - name: Classify conditions (free MeSH lookup; unmatched go to a queue file, no AI)
        working-directory: pipeline
        run: node jobs/classify-conditions.js

      - name: Map conditions to taxonomy (single set-based RPC, no AI)
        working-directory: pipeline
        run: node jobs/map-conditions.js

      - name: Refresh website search index (categories just changed)
        working-directory: pipeline
        run: node jobs/refresh-search.js

      - name: Commit new category queue entries
        run: .github/scripts/commit-queues.sh "Queue new condition classifications"

  # ------------------------------------------------------------------
  # 3. Fill the manual-review queue files. Bounded by QUEUE_BATCH_LIMIT
  #    so this job always finishes; whatever it doesn't reach stays
  #    flagged and is picked up tomorrow.
  #
  #    Order matters: commit and push the queue files FIRST, then clear
  #    the flags. If the job dies in between, the flags stay set and the
  #    work is simply redone — nothing is silently lost.
  # ------------------------------------------------------------------
  queue:
    needs: classify
    # Run even when classify fails, times out, or is cancelled. Filling
    # the summary / headline / callout queues has no dependency on MeSH
    # condition classification, so there is no reason for those to stay
    # frozen while that backlog is worked through. Without this, a
    # classify timeout silently skips the entire queue stage.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }} # only extract-criteria.js still uses this
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: pipeline
        run: npm install

      - name: Queue relationship checks (no AI)
        working-directory: pipeline
        run: node jobs/infer-relationship.js

      - name: Extract eligibility criteria (only remaining AI step)
        working-directory: pipeline
        continue-on-error: true # no Anthropic key set up yet — let the rest of the pipeline run anyway
        run: node jobs/extract-criteria.js

      - name: Queue headline / qualify-note / callout candidates (no AI)
        working-directory: pipeline
        run: node jobs/queue-manual-content.js

      - name: Mirror the summaries queue files against the database (no AI)
        working-directory: pipeline
        run: node jobs/generate-summaries.js

      - name: Commit any new queue file entries
        run: .github/scripts/commit-queues.sh "Queue new items for manual review"

      - name: Mark queued trials as done (only now that the push succeeded)
        working-directory: pipeline
        run: node jobs/confirm-queued.js
