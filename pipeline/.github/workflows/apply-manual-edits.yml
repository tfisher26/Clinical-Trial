name: Apply manual queue edits

on:
  push:
    paths:
      - 'pipeline/pending-summaries/**'
      - 'pipeline/pending-categories/**'
      - 'pipeline/pending-relationships/**'
      - 'pipeline/pending-headlines/**'
      - 'pipeline/pending-qualify-notes/**'
      - 'pipeline/pending-callouts/**'
      - 'pipeline/pending-basics-extra/**'

permissions:
  contents: write   # needed to commit the trimmed-down queue files back

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: pipeline
        run: npm install

